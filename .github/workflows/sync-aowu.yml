name: Sync aowu jar Daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download jar (图片)
        run: python3 scripts/parse_jar.py

      - name: Commit & Push (仅当有更新)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jar/
          if git diff --cached --quiet; then
            echo "✅ 无新图片，跳过提交"
          else
            git commit -m "chore: 自动同步 aowu 图片 ($(date +'%Y-%m-%d %H:%M'))"
            git push
            echo "✅ 已推送新图片"
          fi
