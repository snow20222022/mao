name: Sync aowu jar Daily

on:
  schedule:
    - cron: "0 3 * * *"   # 每天凌晨 3 点 UTC（北京时间 11 点），可自行改
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch JSON
        run: echo "准备拉取 JSON 接口..."

      - name: Download jar (图片)
        run: python3 scripts/parse_jar.py

      - name: Commit & Push (仅当有更新)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 添加 jar/ 目录下所有变更（png/jpg）
          git add jar/

          # 仅当有实际变更才提交推送
          if git diff --cached --quiet; then
            echo "✅ 无新图片，跳过提交"
          else
            git commit -m "chore: 自动同步 aowu 图片 ($(date +'%Y-%m-%d %H:%M'))"
            git push
            echo "✅ 已推送新图片"
          fi
